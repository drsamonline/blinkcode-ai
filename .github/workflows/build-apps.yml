name: Build portable EXE + Android APK

# Turns the app (docs/play) into a portable Windows EXE and an Android APK using
# the shared drsamonline/app-builder kit, and publishes both on the fixed
# `app-latest` release so the download URLs never change:
#   https://github.com/drsamonline/blinkcode-ai/releases/latest/download/blinkcode-ai-portable.exe
#   https://github.com/drsamonline/blinkcode-ai/releases/latest/download/blinkcode-ai.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: blinkcode-ai
  APP_SRC: docs/play
  KIT_REPO: drsamonline/app-builder

jobs:
  exe:
    name: Build portable EXE (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout app-builder kit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KIT_REPO }}
          path: builder

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-repo/package-lock.json

      - name: Stage the web app
        working-directory: app-repo
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Stage app into the launcher
        shell: bash
        run: |
          rm -rf builder/exe/app
          mkdir -p builder/exe/app
          cp -r "app-repo/${APP_SRC}/." builder/exe/app/

      - name: Build portable EXE
        shell: bash
        run: python builder/exe/build.py

      - name: Collect EXE
        shell: bash
        run: |
          mkdir -p out
          cp "builder/exe/dist/${APP_NAME}-portable.exe" "out/${APP_NAME}-portable.exe"
          ls -la out

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: out/${{ env.APP_NAME }}-portable.exe

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout app-builder kit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KIT_REPO }}
          path: builder

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-repo/package-lock.json

      - name: Stage the web app
        working-directory: app-repo
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Stage app into Android assets
        run: |
          rm -rf builder/apk/app/src/main/assets/www
          mkdir -p builder/apk/app/src/main/assets/www
          cp -r "app-repo/${APP_SRC}/." builder/apk/app/src/main/assets/www/
          sed -i "s/APP_NAME_PLACEHOLDER/${APP_NAME}/g" builder/apk/app/src/main/res/values/strings.xml
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > builder/apk/local.properties

      - name: Build signed release APK
        working-directory: builder/apk
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/builder/keystore/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp builder/apk/app/build/outputs/apk/release/app-release.apk "out/${APP_NAME}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/${{ env.APP_NAME }}.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [exe, apk]
    if: always()
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: portable-exe
          path: dist

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Delete any existing app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish release with fixed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create app-latest \
            --repo "${{ github.repository }}" \
            --title "Latest app build" \
            --notes "Automated build of the portable EXE and Android APK from ${{ github.sha }}." \
            "dist/${APP_NAME}-portable.exe" "dist/${APP_NAME}.apk"
